network.torSandbox.notice.headline=Tor runs with reduced sandbox protection
network.torSandbox.notice.intro=Bisq runs Tor in a sandbox that restricts access to your files and Bisq private \
	keys. This helps protect them if a security flaw in Tor is exploited. Some protections are unavailable \
	on this system:
network.torSandbox.notice.hostNetworkForTransports.linux=The pluggable transports used by your bridges require \
	broader network access. This also allows Tor to connect to services on this computer, including services \
	that accept only local connections, and to devices on your local network. Using only obfs4 bridges or \
	connecting without bridges allows Bisq to isolate Tor and restrict this access.
network.torSandbox.notice.hostNetworkForTransports=The pluggable transports used by your bridges require \
	broader network access. This also allows Tor to connect to services on this computer, including services \
	that accept only local connections, and to devices on your local network. Connecting without bridges \
	allows Bisq to isolate Tor and restrict this access.
network.torSandbox.notice.hostNetworkOfSystem.linux=This system cannot isolate Tor from services on this \
	computer or devices on your local network. Tor can therefore connect to them, including services that \
	accept only local connections. This can happen when Linux restricts user namespaces, a feature used \
	to isolate programs. Ubuntu 23.10 and newer apply such restrictions.
network.torSandbox.notice.hostNetworkOfSystem=This system cannot isolate Tor from services on this computer \
	or devices on your local network. Tor can therefore connect to them, including services that accept \
	only local connections.
network.torSandbox.notice.signalsNotIsolated=The sandbox cannot prevent Tor from sending control messages, \
	called signals, to other programs running under your user account. These messages can, for example, \
	stop a program. Linux 6.12 or newer provides protection against this.

