settings.bisqConnect.clients.revoke.confirm=क्लाइंट ''{0}'' के लिए एक क्रिया चुनें:\n\n• रद्द करें: क्लाइंट को स्थायी रूप से हटा देता है। इसे फिर से पेयर करना होगा।\n• सत्र अमान्य करें: वर्तमान सत्र को अमान्य करता है। क्लाइंट को स्वचालित रूप से फिर से कनेक्ट होना चाहिए।
settings.bisqConnect.clients.revoke.incomplete=क्लाइंट ''{0}'' को रद्द करने की प्रक्रिया पूरी नहीं हुई।\n\nयह अभी भी कनेक्टेड हो सकता है या सूचनाएँ प्राप्त कर सकता है। पुनः प्रयास करें।
