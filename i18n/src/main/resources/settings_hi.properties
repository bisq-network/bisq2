settings.network.tor.headline=Tor विकल्प
settings.network.tor.allowPluggableTransports=Tor सैंडबॉक्स में प्लगेबल ट्रांसपोर्ट की अनुमति दें
settings.network.tor.allowPluggableTransports.info=प्लगेबल ट्रांसपोर्ट सहायक प्रोग्राम हैं जिनका Tor कनेक्शन ब्लॉक को बायपास करने के लिए ब्रिज के साथ उपयोग करता है। Bisq इनका उपयोग केवल उन ब्रिज के लिए करता है जो Bisq डेटा निर्देशिका में bisq.conf में कॉन्फ़िगर किए गए हैं।\n\nडिफ़ॉल्ट रूप से इन्हें ब्लॉक किया जाता है, क्योंकि Tor को अतिरिक्त प्रोग्राम शुरू करने की अनुमति देने से कुछ सैंडबॉक्स सुरक्षा कम हो जाती है। Linux पर obfs4 को छोड़कर सभी ट्रांसपोर्ट के लिए व्यापक नेटवर्क पहुँच भी आवश्यक होती है, जिससे Tor आपके कंप्यूटर की सेवाओं और आपके स्थानीय नेटवर्क के उपकरणों से कनेक्ट कर सकता है।\n\nयह सेटिंग केवल Bisq द्वारा शुरू किए गए Tor इंस्टेंस पर लागू होती है। परिवर्तन प्रभावी करने के लिए Bisq को पुनः प्रारंभ करें।
settings.network.tor.allowPluggableTransports.warn=Bisq, Tor को एक सैंडबॉक्स में चलाता है जो आपके कंप्यूटर पर Tor की पहुँच को सीमित करता है। यदि Tor में किसी सुरक्षा खामी का फायदा उठाया जाए, तो यह आपकी फ़ाइलों और निजी कुंजियों की सुरक्षा में मदद करता है।\n\nप्लगेबल ट्रांसपोर्ट सहायक प्रोग्राम हैं जिनका उपयोग ब्रिज Tor कनेक्शन पर लगे ब्लॉक को बायपास करने के लिए करते हैं। इन्हें अनुमति देने से कुछ सैंडबॉक्स सुरक्षा कम हो जाती है, क्योंकि Tor इन अतिरिक्त प्रोग्रामों को शुरू कर सकता है।\n\nLinux पर obfs4 को छोड़कर सभी ट्रांसपोर्ट के लिए Tor और सहायक प्रोग्रामों को व्यापक नेटवर्क पहुँच की भी आवश्यकता होती है। इससे वे आपके कंप्यूटर की सेवाओं, जिनमें केवल स्थानीय कनेक्शन स्वीकार करने वाली सेवाएँ भी शामिल हैं, और आपके स्थानीय नेटवर्क के उपकरणों से कनेक्ट कर सकते हैं।\n\nप्लगेबल ट्रांसपोर्ट की अनुमति केवल तभी दें, जब आपके ब्रिज को उनकी आवश्यकता हो। परिवर्तन प्रभावी करने के लिए Bisq को पुनः प्रारंभ करें।
settings.network.tor.allowPluggableTransports.warn.accept=हाँ, प्लगेबल ट्रांसपोर्ट की अनुमति दें
settings.network.tor.allowPluggableTransports.warn.cancel=नहीं, उन्हें ब्लॉक ही रहने दें
settings.network.tor.allowPluggableTransports.sandboxDisabled=कॉन्फ़िगरेशन में Tor सैंडबॉक्स बंद है। Tor और कॉन्फ़िगर किए गए सभी प्लगेबल ट्रांसपोर्ट सैंडबॉक्स सुरक्षा के बिना चलते हैं।
settings.network.tor.allowPluggableTransports.commandLine=Bisq को विकल्प {0}={1} के साथ शुरू किया गया था। यह विकल्प Bisq की सेटिंग फ़ाइल bisq.conf में मौजूद सेटिंग्स पर प्राथमिकता लेता है, इसलिए यह स्विच सेटिंग नहीं बदल सकता। स्विच का उपयोग करने के लिए Bisq को इस विकल्प के बिना शुरू करें।
settings.network.tor.allowPluggableTransports.windows=Windows पर प्लगेबल ट्रांसपोर्ट Tor सैंडबॉक्स के भीतर नहीं चल सकते। इनका उपयोग करने वाले ब्रिज के लिए सैंडबॉक्स को बंद करना आवश्यक है। ऐसा करने के लिए, bisq.conf में application.network.configByTransportType.tor.sandbox.enabled=false सेट करें। इससे सैंडबॉक्स द्वारा प्रदान की जाने वाली सुरक्षा हट जाती है।
settings.network.resetToDefaults=डिफ़ॉल्ट मानों पर रीसेट करें
