settings.bisqConnect.apiConfig.headline=API-Konfiguration
settings.bisqConnect.apiConfig.info=Es wird empfohlen, Tor für die Verbindung zur API zu verwenden. Wenn Sie das Clearnet wählen, ist die Verwendung von LAN die nächstbeste Option – wenden Sie den erkannten LAN-Host an. Die Verwendung der öffentlichen IP-Adresse wird nur für fortgeschrittene Benutzer empfohlen und birgt Sicherheitsrisiken. Für Clearnet-Verbindungen wird TLS mit einem selbstsignierten Zertifikat verwendet, um eine sichere Verbindung zu gewährleisten.

