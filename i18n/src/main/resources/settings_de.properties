settings.network.i2p.bi2pGrpcAddress.help=Standard: 127.0.0.1:6159

settings.network.tor.headline=Tor-Optionen
settings.network.tor.allowPluggableTransports=Pluggable Transports in der Tor-Sandbox zulassen
settings.network.tor.allowPluggableTransports.info=Pluggable Transports sind Hilfsprogramme, die Tor zusammen mit Brücken verwendet, um Verbindungsblockaden zu umgehen. Bisq verwendet sie nur für Brücken, die in der bisq.conf im Bisq-Datenverzeichnis konfiguriert sind.\n\nSie sind standardmäßig blockiert, da das Zulassen zusätzlicher Programme, die von Tor gestartet werden, einige Sandbox-Schutzmaßnahmen verringert. Alle Transports außer obfs4 unter Linux erfordern außerdem einen umfassenderen Netzwerkzugriff, wodurch Tor eine Verbindung zu Diensten auf Ihrem Computer und Geräten in Ihrem lokalen Netzwerk herstellen kann.\n\nDiese Einstellung gilt nur für die von Bisq gestartete Tor-Instanz. Starten Sie Bisq neu, damit die Änderung wirksam wird.
settings.network.tor.allowPluggableTransports.warn=Bisq führt Tor in einer Sandbox aus, die einschränkt, worauf Tor auf Ihrem Computer zugreifen kann. Dies hilft, Ihre Dateien und privaten Schlüssel zu schützen, falls eine Sicherheitslücke in Tor ausgenutzt wird.\n\nPluggable Transports sind Hilfsprogramme, die Brücken verwenden, um Blockaden von Tor-Verbindungen zu umgehen. Ihr Zulassen verringert einige Sandbox-Schutzmaßnahmen, da Tor dadurch diese zusätzlichen Programme starten kann.\n\nAlle Transports außer obfs4 unter Linux erfordern außerdem einen umfassenderen Netzwerkzugriff für Tor und die Hilfsprogramme. Dadurch können sie eine Verbindung zu Diensten auf Ihrem Computer herstellen, einschließlich Diensten, die nur lokale Verbindungen akzeptieren, sowie zu Geräten in Ihrem lokalen Netzwerk.\n\nLassen Sie Pluggable Transports nur zu, wenn Ihre Brücken sie benötigen. Starten Sie Bisq neu, damit die Änderung wirksam wird.
settings.network.tor.allowPluggableTransports.warn.accept=Ja, Pluggable Transports zulassen
settings.network.tor.allowPluggableTransports.warn.cancel=Nein, sie blockiert lassen
settings.network.tor.allowPluggableTransports.sandboxDisabled=Die Tor-Sandbox ist in der Konfiguration deaktiviert. Tor und alle konfigurierten Pluggable Transports werden ohne Sandbox-Schutz ausgeführt.
settings.network.tor.allowPluggableTransports.commandLine=Bisq wurde mit der Option {0}={1} gestartet. Diese Option hat Vorrang vor den Einstellungen in bisq.conf, der Einstellungsdatei von Bisq, sodass dieser Schalter die Einstellung nicht ändern kann. Starten Sie Bisq ohne diese Option, um den Schalter verwenden zu können.
settings.network.tor.allowPluggableTransports.windows=Unter Windows können Pluggable Transports nicht innerhalb der Tor-Sandbox ausgeführt werden. Brücken, die sie verwenden, erfordern, dass die Sandbox deaktiviert wird. Setzen Sie dazu application.network.configByTransportType.tor.sandbox.enabled=false in der bisq.conf. Dadurch entfällt der von der Sandbox bereitgestellte Sicherheitsschutz.
