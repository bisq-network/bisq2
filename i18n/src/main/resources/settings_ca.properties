settings.network.i2p.bi2pGrpcAddress.help=Per defecte: 127.0.0.1:6159

settings.network.tor.headline=Opcions de Tor
settings.network.tor.allowPluggableTransports=Permet els transports connectables a l'entorn aïllat de Tor
settings.network.tor.allowPluggableTransports.info=Els transports connectables són programes auxiliars que Tor utilitza amb ponts per eludir els bloquejos de connexió. Bisq els utilitza només per als ponts configurats a bisq.conf, al directori de dades de Bisq.\n\nEstan bloquejats per defecte perquè permetre que Tor iniciï programes addicionals redueix algunes proteccions de l'entorn aïllat. Tots els transports, excepte obfs4 a Linux, també requereixen un accés a la xarxa més ampli, cosa que permet a Tor connectar-se a serveis de l'ordinador i a dispositius de la xarxa local.\n\nAquesta configuració només s'aplica a la instància de Tor iniciada per Bisq. Reinicieu Bisq perquè el canvi tingui efecte.
settings.network.tor.allowPluggableTransports.warn=Bisq executa Tor en un entorn aïllat que restringeix a què pot accedir Tor a l'ordinador. Això ajuda a protegir els fitxers i les claus privades si s'explota una vulnerabilitat de seguretat de Tor.\n\nEls transports connectables són programes auxiliars que els ponts utilitzen per eludir els bloquejos de les connexions de Tor. Permetre'ls redueix algunes proteccions de l'entorn aïllat, ja que permet que Tor iniciï aquests programes addicionals.\n\nTots els transports, excepte obfs4 a Linux, també requereixen un accés a la xarxa més ampli per a Tor i els programes auxiliars. Això els permet connectar-se a serveis de l'ordinador, inclosos serveis que només accepten connexions locals, i a dispositius de la xarxa local.\n\nPermeteu els transports connectables només si els ponts els necessiten. Reinicieu Bisq perquè el canvi tingui efecte.
settings.network.tor.allowPluggableTransports.warn.accept=Sí, permet els transports connectables
settings.network.tor.allowPluggableTransports.warn.cancel=No, mantén-los bloquejats
settings.network.tor.allowPluggableTransports.sandboxDisabled=L'entorn aïllat de Tor està desactivat a la configuració. Tor i qualsevol transport connectable configurat s'executen sense protecció de l'entorn aïllat.
settings.network.tor.allowPluggableTransports.commandLine=Bisq s''ha iniciat amb l''opció {0}={1}. Aquesta opció té prioritat sobre la configuració de bisq.conf, el fitxer de configuració de Bisq, de manera que aquest commutador no pot canviar la configuració. Inicieu Bisq sense aquesta opció per utilitzar el commutador.
settings.network.tor.allowPluggableTransports.windows=A Windows, els transports connectables no poden executar-se dins de l'entorn aïllat de Tor. Els ponts que els utilitzen requereixen que l'entorn aïllat estigui desactivat. Per fer-ho, establiu application.network.configByTransportType.tor.sandbox.enabled=false a bisq.conf. Això elimina la protecció de seguretat proporcionada per l'entorn aïllat.
