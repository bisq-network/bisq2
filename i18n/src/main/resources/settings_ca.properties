settings.bisqConnect.apiConfig.headline=Configuració de l'API
settings.bisqConnect.apiConfig.info=Es recomana utilitzar Tor per connectar-se a l'API. Si escolliu clearnet, utilitzar LAN és la següent millor opció — apliqueu l'amfitrió LAN detectat. Utilitzar l'adreça IP pública només es recomana per a usuaris avançats i comporta riscos de seguretat. Per a connexions clearnet, s'utilitza TLS amb un certificat autofirmat per garantir una connexió segura.

