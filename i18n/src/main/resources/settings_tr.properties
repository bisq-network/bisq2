settings.network.tor.headline=Tor seçenekleri
settings.network.tor.allowPluggableTransports=Tor korumalı alanında takılabilir taşımalara izin ver
settings.network.tor.allowPluggableTransports.info=Takılabilir taşımalar, Tor'un bağlantı engellerini aşmak için köprülerle birlikte kullandığı yardımcı programlardır. Bisq bunları yalnızca Bisq veri dizinindeki bisq.conf dosyasında yapılandırılmış köprüler için kullanır.\n\nTor'un ek programlar başlatmasına izin vermek bazı korumalı alan korumalarını azalttığı için bunlar varsayılan olarak engellenir. Linux'ta obfs4 dışındaki tüm taşımalar ayrıca daha geniş ağ erişimi gerektirir; bu da Tor'un bilgisayarınızdaki hizmetlere ve yerel ağınızdaki cihazlara bağlanmasına olanak tanır.\n\nBu ayar yalnızca Bisq tarafından başlatılan Tor örneği için geçerlidir. Değişikliğin etkili olması için Bisq'ı yeniden başlatın.
settings.network.tor.allowPluggableTransports.warn=Bisq, Tor'un bilgisayarınızda erişebileceklerini kısıtlayan bir korumalı alan içinde Tor'u çalıştırır. Bu, Tor'daki bir güvenlik açığından yararlanılması durumunda dosyalarınızı ve özel anahtarlarınızı korumaya yardımcı olur.\n\nTakılabilir taşımalar, köprülerin Tor bağlantılarındaki engelleri aşmak için kullandığı yardımcı programlardır. Bunlara izin vermek, Tor'un bu ek programları başlatmasına olanak tanıyarak bazı korumalı alan korumalarını azaltır.\n\nLinux'ta obfs4 dışındaki tüm taşımalar, Tor ve yardımcı programlar için ayrıca daha geniş ağ erişimi gerektirir. Bu, onların bilgisayarınızdaki hizmetlere, yalnızca yerel bağlantıları kabul edenler de dahil olmak üzere, ve yerel ağınızdaki cihazlara bağlanmasına olanak tanır.\n\nTakılabilir taşımalara yalnızca köprüleriniz bunları gerektiriyorsa izin verin. Değişikliğin etkili olması için Bisq'ı yeniden başlatın.
settings.network.tor.allowPluggableTransports.warn.accept=Evet, takılabilir taşımalara izin ver
settings.network.tor.allowPluggableTransports.warn.cancel=Hayır, engelli kalsınlar
settings.network.tor.allowPluggableTransports.sandboxDisabled=Tor korumalı alanı yapılandırmada kapatılmıştır. Tor ve yapılandırılmış tüm takılabilir taşımalar korumalı alan koruması olmadan çalışır.
settings.network.tor.allowPluggableTransports.commandLine=Bisq, {0}={1} seçeneğiyle başlatıldı. Bu seçenek, Bisq''ın ayar dosyası olan bisq.conf''taki ayarlara göre önceliklidir; bu nedenle bu anahtar ayarı değiştiremez. Anahtarı kullanmak için Bisq''ı bu seçenek olmadan başlatın.
settings.network.tor.allowPluggableTransports.windows=Windows'ta takılabilir taşımalar Tor korumalı alanı içinde çalışamaz. Bunları kullanan köprüler, korumalı alanın kapatılmasını gerektirir. Bunu yapmak için bisq.conf dosyasında application.network.configByTransportType.tor.sandbox.enabled=false olarak ayarlayın. Bu, korumalı alanın sağladığı güvenlik korumasını kaldırır.
settings.network.resetToDefaults=Varsayılan değerlere sıfırla
settings.network.shutdown=Değişiklikleri uygula ve yeniden başlat

