syntax = "proto3";

package wallet;

option java_multiple_files = true;
option java_package = "bisq.wallet.protobuf";

message ReceiveAddressEntry {
  string address = 1;
  sint64 createdAt = 2;
  optional string note = 3;
}

message ReceiveAddressStore {
  repeated ReceiveAddressEntry receiveAddressEntries = 1;
}
