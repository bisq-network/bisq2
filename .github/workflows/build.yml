name: Build Bisq 2

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_bisq:
    name: Build Bisq on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]

    uses: ./.github/workflows/build_bisq_module.yml
    with:
      os: ${{ matrix.os }}
      name: Bisq
      build-root-dir: .

  build_apps_module:
    name: Build apps module on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]

    uses: ./.github/workflows/build_bisq_module.yml
    with:
      os: ${{ matrix.os }}
      name: apps module
      build-root-dir: apps

  build_network_module:
    name: Build network module on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]

    uses: ./.github/workflows/build_bisq_module.yml
    with:
      os: ${{ matrix.os }}
      name: network module
      build-root-dir: network

  build_tor_module:
    name: Build tor module on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]

    uses: ./.github/workflows/build_bisq_module.yml
    with:
      os: ${{ matrix.os }}
      name: tor module
      build-root-dir: network/tor

  # Both checks guard a silent failure. A non-final PersistableStore makes its persistence key follow the runtime class
  # instead of the class declaring the resolver, so the store reads back as corrupted and the user loses its content.
  # A resolver registered with the wrong class or a mistyped proto type name drops the type from the storage whitelist
  # or files its resolver under a key nothing looks up. The module builds above run with `-x test`, so these checks
  # would otherwise not run anywhere.
  check_resolver_registrations:
    name: Check resolver registrations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Gradle wrapper checksums
        shell: bash
        run: sha256sum -c gradle/wrapper/gradle-wrapper.sha256

      - name: Setup Java JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21.0.11'
          distribution: 'zulu'
          check-latest: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Run resolver registration checks
        shell: bash
        run: |
          ./gradlew \
            :persistence:test --tests 'bisq.persistence.PersistableStoreFinalityTest' \
            :application:test --tests 'bisq.application.ResolverConfigTest'
