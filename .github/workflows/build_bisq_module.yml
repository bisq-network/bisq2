on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Bisq 2
    runs-on: ${{ inputs.os }}
    # This job runs all module tests. Allow more time than the former 60-minute per-module jobs.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Verify Gradle wrapper checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c gradle/wrapper/gradle-wrapper.sha256
          else
            shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21.0.13+9'
          distribution: 'zulu'
          check-latest: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Apps, desktop, and network must run from the repository root to use its dependency verification metadata.
      - name: Build Bisq, apps, desktop, and network
        id: build_composite
        shell: bash
        run: ./gradlew --continue :build-logic:build build :apps:build :apps:desktop:build :network:build

      # Tor has its own dependency verification metadata. Run it even if another module fails.
      - name: Build Tor
        id: build_tor
        env:
          # Inherited by the test JVM, so JUnit records threads before interrupting a timed-out test.
          JAVA_TOOL_OPTIONS: -Djunit.jupiter.execution.timeout.threaddump.enabled=true
        if: ${{ success() || steps.build_composite.outcome == 'failure' }}
        shell: bash
        run: ./gradlew -p tor --continue build

      - name: Print failed Tor test reports
        if: ${{ always() && steps.build_tor.outcome == 'failure' }}
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in sorted(Path("tor").glob("*/build/test-results/*/TEST-*.xml")):
              root = ET.parse(path).getroot()
              if root.find(".//failure") is None and root.find(".//error") is None:
                  continue
              print(f"Failed test report: {path}", flush=True)
              for element in root.iter():
                  if element.tag in {"failure", "error", "system-out", "system-err"}:
                      print(element.text or "", flush=True)
          PYTHON
