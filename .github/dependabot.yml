version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/apps/api-app/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The tag is the Java feature version of the build. A new feature version is a change of the build.
      - dependency-name: "azul/zulu-openjdk"
        update-types: ["version-update:semver-major"]
