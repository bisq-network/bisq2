firstPRWelcomeComment: >
    **Thanks for opening this pull request!**<br/><br/>**Please note:** Bisq has temporarily paused accepting new contributors for compensated development and routinely reviewing their PRs. New contributors should not assume that a submitted PR will be reviewed or compensated. Before investing substantial time, please contact the relevant maintainers to discuss priorities, review capacity, and whether funded work is available. See [Open Source Software Development in the Age of AI](https://bisq.network/blog/open-source-development-in-the-age-of-ai/) for the background.<br/><br/>Please read the [dev guide](https://github.com/bisq-network/bisq2/blob/main/docs/dev/dev-guide.md) and check if *CI* found any issues with your PR.
